# Perfil local/dev para execucao completa do pipeline (:8080, :8081, :8082 + H2 TCP :9092 em modo PostgreSQL)
spring.datasource.url=jdbc:h2:mem:catalogo_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Habilita integracao com a API de Filtros (:8081) e simuladores locais (:8081 e :8082) enquanto os microsservicos da equipe nao existem
integration.filter-api.enabled=${FILTER_API_ENABLED:true}
integration.local-simulators.enabled=${LOCAL_SIMULATORS_ENABLED:true}
integration.local-simulators.filter-port=${LOCAL_FILTER_PORT:8081}
integration.local-simulators.share-port=${LOCAL_SHARE_PORT:8082}
integration.local-simulators.h2-tcp-port=${LOCAL_H2_TCP_PORT:9092}
