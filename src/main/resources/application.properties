spring.application.name=catalogo-promocoes
server.port=${SERVER_PORT:8080}

# Banco de Dados Principal (PostgreSQL) — Credenciais externalizadas via variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Observabilidade e Health Checks (Spring Boot Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Contrato com a API de Filtros (Servico 2)
integration.filter-api.enabled=${FILTER_API_ENABLED:false}
integration.filter-api.base-url=${FILTER_API_BASE_URL:http://localhost:8081}
integration.filter-api.api-key=${FILTER_API_KEY:}
integration.filter-api.connect-timeout-ms=${FILTER_API_CONNECT_TIMEOUT_MS:3000}
integration.filter-api.read-timeout-ms=${FILTER_API_READ_TIMEOUT_MS:8000}

# Resiliencia Global, Deduplicacao e Conversao de Moeda
integration.resilience.connect-timeout-ms=${INTEGRATION_CONNECT_TIMEOUT_MS:3000}
integration.resilience.read-timeout-ms=${INTEGRATION_READ_TIMEOUT_MS:8000}
integration.resilience.retry-max-attempts=${INTEGRATION_RETRY_MAX_ATTEMPTS:3}
integration.resilience.retry-initial-delay-ms=${INTEGRATION_RETRY_INITIAL_DELAY_MS:300}
integration.resilience.circuit-failure-threshold=${INTEGRATION_CIRCUIT_FAILURE_THRESHOLD:5}
integration.resilience.circuit-open-duration-seconds=${INTEGRATION_CIRCUIT_OPEN_DURATION_SECONDS:60}
integration.deduplication.ttl-minutes=${INTEGRATION_DEDUP_TTL_MINUTES:360}
integration.currency.usd-to-brl-rate=${CURRENCY_USD_BRL_RATE:5.75}
integration.affiliate.campaign-prefix=${AFFILIATE_CAMPAIGN_PREFIX:agy}

# Varejista 1: Shopee Brasil (GraphQL Open API)
integration.retailers.shopee.enabled=${RETAILER_SHOPEE_ENABLED:true}
integration.retailers.shopee.sandbox-mode=${RETAILER_SHOPEE_SANDBOX_MODE:false}
integration.retailers.shopee.api-url=${RETAILER_SHOPEE_API_URL:https://open-api.affiliate.shopee.com.br/graphql}
integration.retailers.shopee.app-id=${RETAILER_SHOPEE_APP_ID:}
integration.retailers.shopee.app-secret=${RETAILER_SHOPEE_APP_SECRET:}

# Varejista 2: AliExpress (AE-Affiliate Open Platform)
integration.retailers.aliexpress.enabled=${RETAILER_ALIEXPRESS_ENABLED:true}
integration.retailers.aliexpress.sandbox-mode=${RETAILER_ALIEXPRESS_SANDBOX_MODE:false}
integration.retailers.aliexpress.api-url=${RETAILER_ALIEXPRESS_API_URL:https://api-sg.aliexpress.com/sync}
integration.retailers.aliexpress.app-key=${RETAILER_ALIEXPRESS_APP_KEY:}
integration.retailers.aliexpress.app-secret=${RETAILER_ALIEXPRESS_APP_SECRET:}
integration.retailers.aliexpress.tracking-id=${RETAILER_ALIEXPRESS_TRACKING_ID:default}

# Varejista 3: Mercado Livre Brasil (REST MLB + Afiliados)
integration.retailers.mercadolivre.enabled=${RETAILER_MERCADOLIVRE_ENABLED:false}
integration.retailers.mercadolivre.sandbox-mode=${RETAILER_MERCADOLIVRE_SANDBOX_MODE:false}
integration.retailers.mercadolivre.api-url=${RETAILER_MERCADOLIVRE_API_URL:https://api.mercadolibre.com}
integration.retailers.mercadolivre.client-id=${RETAILER_MERCADOLIVRE_CLIENT_ID:}
integration.retailers.mercadolivre.client-secret=${RETAILER_MERCADOLIVRE_CLIENT_SECRET:}
integration.retailers.mercadolivre.access-token=${RETAILER_MERCADOLIVRE_ACCESS_TOKEN:}
integration.retailers.mercadolivre.refresh-token=${RETAILER_MERCADOLIVRE_REFRESH_TOKEN:}
integration.retailers.mercadolivre.affiliate-tool=${RETAILER_MERCADOLIVRE_AFFILIATE_TOOL:}
integration.retailers.mercadolivre.affiliate-word=${RETAILER_MERCADOLIVRE_AFFILIATE_WORD:}

# Varejista 4: Amazon Brasil (Creators API OAuth 2.0)
integration.retailers.amazon.enabled=${RETAILER_AMAZON_ENABLED:false}
integration.retailers.amazon.sandbox-mode=${RETAILER_AMAZON_SANDBOX_MODE:false}
integration.retailers.amazon.api-url=${RETAILER_AMAZON_API_URL:https://affiliate-program.amazon.com/creatorsapi/v1}
integration.retailers.amazon.token-url=${RETAILER_AMAZON_TOKEN_URL:https://api.amazon.com/auth/o2/token}
integration.retailers.amazon.credential-id=${RETAILER_AMAZON_CREDENTIAL_ID:}
integration.retailers.amazon.credential-secret=${RETAILER_AMAZON_CREDENTIAL_SECRET:}
integration.retailers.amazon.partner-tag=${RETAILER_AMAZON_PARTNER_TAG:}
integration.retailers.amazon.marketplace=${RETAILER_AMAZON_MARKETPLACE:www.amazon.com.br}
integration.retailers.amazon.max-tps=${RETAILER_AMAZON_MAX_TPS:1}

# Rede Oficial Lomadee v3 (Magalu, KaBuM!, Casas Bahia, Americanas, Netshoes)
integration.lomadee.api-url=${LOMADEE_API_URL:https://api.lomadee.com.br}
integration.lomadee.api-key=${LOMADEE_API_KEY:}
integration.lomadee.source-id=${LOMADEE_SOURCE_ID:}

integration.retailers.magalu.enabled=${RETAILER_MAGALU_ENABLED:false}
integration.retailers.magalu.sandbox-mode=${RETAILER_MAGALU_SANDBOX_MODE:false}
integration.retailers.magalu.brand-id=${RETAILER_MAGALU_BRAND_ID:magazineluiza}

integration.retailers.kabum.enabled=${RETAILER_KABUM_ENABLED:false}
integration.retailers.kabum.sandbox-mode=${RETAILER_KABUM_SANDBOX_MODE:false}
integration.retailers.kabum.brand-id=${RETAILER_KABUM_BRAND_ID:kabum}

integration.retailers.casasbahia.enabled=${RETAILER_CASASBAHIA_ENABLED:false}
integration.retailers.casasbahia.sandbox-mode=${RETAILER_CASASBAHIA_SANDBOX_MODE:false}
integration.retailers.casasbahia.brand-id=${RETAILER_CASASBAHIA_BRAND_ID:casasbahia}

integration.retailers.americanas.enabled=${RETAILER_AMERICANAS_ENABLED:false}
integration.retailers.americanas.sandbox-mode=${RETAILER_AMERICANAS_SANDBOX_MODE:false}
integration.retailers.americanas.brand-id=${RETAILER_AMERICANAS_BRAND_ID:americanas}

integration.retailers.netshoes.enabled=${RETAILER_NETSHOES_ENABLED:false}
integration.retailers.netshoes.sandbox-mode=${RETAILER_NETSHOES_SANDBOX_MODE:false}
integration.retailers.netshoes.brand-id=${RETAILER_NETSHOES_BRAND_ID:netshoes}

# Rede Oficial Awin (Opcional / Complementar)
integration.awin.api-url=${AWIN_API_URL:https://api.awin.com}
integration.awin.oauth-token=${AWIN_OAUTH_TOKEN:}
integration.awin.publisher-id=${AWIN_PUBLISHER_ID:}
